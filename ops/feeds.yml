# RSS/Atom Feed 資料來源設定
# 所有 enabled=true 的來源都會被自動抓取

sources:
  - key: "hacker_news"
    name: "Hacker News (RSS)"
    url: "https://news.ycombinator.com/rss"
    type: "rss"
    category: "community"
    tags:
      - "startup"
      - "engineering"
    enabled: true
    limit: 30

  # GitHub 官方沒有 RSS，因此使用第三方 GitHubTrendingRSS。請視需求自架 RSSHub 作為備援。
  - key: "github_trending"
    name: "GitHub Trending"
    url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
    type: "rss"
    category: "trend"
    tags:
      - "open-source"
      - "github"
      - "trending"
    enabled: true
    limit: 25

  - key: "devto"
    name: "Dev.to"
    url: "https://dev.to/feed"
    type: "rss"
    category: "community"
    tags:
      - "community"
      - "engineering"
    enabled: true

  - key: "techcrunch_ai"
    name: "TechCrunch AI"
    url: "https://techcrunch.com/tag/artificial-intelligence/feed/"
    type: "rss"
    category: "news"
    tags:
      - "AI"
      - "news"
    enabled: true
    limit: 20

  - key: "github_releases_pytorch"
    name: "GitHub Releases - PyTorch"
    url: "https://github.com/pytorch/pytorch/releases.atom"
    type: "atom"
    category: "releases"
    tags:
      - "github"
      - "releases"
      - "pytorch"
      - "AI"
    enabled: true
    limit: 15

  - key: "github_releases_vscode"
    name: "GitHub Releases - VS Code"
    url: "https://github.com/microsoft/vscode/releases.atom"
    type: "atom"
    category: "releases"
    tags:
      - "github"
      - "releases"
      - "editor"
    enabled: true
    limit: 15

  # Hugging Face 官方沒有穩定 RSS，此處使用第三方 Takara feed，必要時可自建。
  - key: "huggingface_daily_papers"
    name: "Hugging Face Daily Papers"
    url: "https://papers.takara.ai/api/feed"
    type: "rss"
    category: "papers"
    tags:
      - "huggingface"
      - "research"
      - "AI"
    enabled: true
    limit: 20

  # 需要 Product Hunt API Token（見 README），啟用前請先設定 GitHub Secret。
  - key: "producthunt_daily"
    name: "Product Hunt Daily"
    url: "https://api.producthunt.com/v2/api/graphql"
    type: "producthunt"
    category: "product"
    tags:
      - "producthunt"
      - "startup"
      - "launch"
    enabled: false
    limit: 20
  # ── 製造工程專業期刊 ──────────────────────────────────────

  # MDPI Journal of Manufacturing and Materials Processing
  # 涵蓋：板金彎折、springback、成形製程、數位孿生
  - key: "mdpi_jmmp"
    name: "MDPI - Journal of Manufacturing and Materials Processing"
    url: "https://www.mdpi.com/rss/journal/jmmp"
    type: "rss"
    category: "papers"
    tags:
      - "manufacturing"
      - "sheet-metal"
      - "bending"
      - "research"
    enabled: true
    limit: 15

  # MDPI Applied Sciences - 工業自動化 / CAD/CAM 子集
  - key: "mdpi_applsci"
    name: "MDPI - Applied Sciences (Manufacturing)"
    url: "https://www.mdpi.com/rss/journal/applsci"
    type: "rss"
    category: "papers"
    tags:
      - "applied-science"
      - "automation"
      - "CAD"
      - "research"
    enabled: true
    limit: 15

  # MDPI Sensors - 工業感測 / PLC / 視覺檢測
  - key: "mdpi_sensors"
    name: "MDPI - Sensors (Industrial)"
    url: "https://www.mdpi.com/rss/journal/sensors"
    type: "rss"
    category: "papers"
    tags:
      - "sensors"
      - "industrial"
      - "vision"
      - "research"
    enabled: true
    limit: 10

  # ── arXiv API 精確查詢 ────────────────────────────────────

  # DXF / Sheet Metal / CAD 相關
  - key: "arxiv_cad_dxf"
    name: "arXiv - CAD / DXF / Sheet Metal"
    url: "http://export.arxiv.org/api/query?search_query=all:DXF+OR+all:%22sheet+metal%22+AND+all:manufacturing&sortBy=submittedDate&sortOrder=descending&max_results=15"
    type: "atom"
    category: "papers"
    tags:
      - "CAD"
      - "DXF"
      - "manufacturing"
      - "research"
    enabled: true
    limit: 15

  # SolidWorks / AutoCAD / CAM 相關
  - key: "arxiv_solidworks_autocad"
    name: "arXiv - SolidWorks / AutoCAD / CAM"
    url: "http://export.arxiv.org/api/query?search_query=all:SolidWorks+OR+all:AutoCAD+AND+all:manufacturing&sortBy=submittedDate&sortOrder=descending&max_results=15"
    type: "atom"
    category: "papers"
    tags:
      - "SolidWorks"
      - "AutoCAD"
      - "CAM"
      - "research"
    enabled: true
    limit: 15

  # 壓床 / 板金彎折 / 數位孿生製造
  - key: "arxiv_press_brake"
    name: "arXiv - Press Brake / Bending / Digital Twin Manufacturing"
    url: "http://export.arxiv.org/api/query?search_query=all:%22press+brake%22+OR+all:%22sheet+metal+bending%22+OR+%28all:%22digital+twin%22+AND+all:manufacturing%29&sortBy=submittedDate&sortOrder=descending&max_results=15"
    type: "atom"
    category: "papers"
    tags:
      - "press-brake"
      - "bending"
      - "digital-twin"
      - "research"
    enabled: true
    limit: 15

  # ── IEEE Xplore 搜尋結果 RSS ──────────────────────────────

  # IEEE - Sheet Metal Bending + Automation
  - key: "ieee_sheet_metal"
    name: "IEEE Xplore - Sheet Metal Bending Automation"
    url: "https://ieeexplore.ieee.org/rss/searchresults?querytext=sheet+metal+bending+automation&newsort=date"
    type: "rss"
    category: "papers"
    tags:
      - "IEEE"
      - "sheet-metal"
      - "automation"
      - "research"
    enabled: true
    limit: 10

  # IEEE - CAD CAM Manufacturing Intelligence
  - key: "ieee_cad_cam"
    name: "IEEE Xplore - CAD CAM Smart Manufacturing"
    url: "https://ieeexplore.ieee.org/rss/searchresults?querytext=CAD+CAM+smart+manufacturing&newsort=date"
    type: "rss"
    category: "papers"
    tags:
      - "IEEE"
      - "CAD"
      - "CAM"
      - "smart-manufacturing"
      - "research"
    enabled: true
    limit: 10