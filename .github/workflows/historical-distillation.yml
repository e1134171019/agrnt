name: historical-distillation

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  run-distillation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install markdown playwright
          playwright install --with-deps chromium

      - name: Run Historical Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ops/historical_reviewer.py

      - name: Commit and Push Arsenal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Brownfield_Verified_Arsenal.md Brownfield_Verified_Arsenal.pdf
          git commit -m "docs: generate Brownfield Verified Arsenal [skip ci]" || echo "No changes to commit"
          git push
