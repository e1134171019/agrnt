name: gap-analysis

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run-gap-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 67-paper × T01-T17 gap analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python analyze_gaps.py

      - name: Get report date
        id: report
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          ls out/gap_analysis_*.md 2>/dev/null && echo "Report files found" || echo "No report files found"

      - name: Create GitHub Issue with gap analysis report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const date = '${{ steps.report.outputs.date }}';
            const reportFile = `out/gap_analysis_${date}.md`;

            let body = '';
            if (fs.existsSync(reportFile)) {
              body = fs.readFileSync(reportFile, 'utf8');
              // GitHub Issue 上限 65536 bytes，安全截斷
              if (body.length > 65000) {
                body = body.substring(0, 65000) + '\n\n...(報告過長，已截斷)';
              }
            } else {
              body = '找不到報告檔案：' + reportFile;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 [研究規劃] 67篇文獻 × T01-T17 待決清單比對報告 ${date}`,
              body: body,
            });
